name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check tag matches manifest
        run: node -e 'const m=require("./module.json"); if(process.env.GITHUB_REF_NAME!==`v${m.version}`)process.exit(1)'
      - run: python3 tools/package.py
      - name: Publish Foundry assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/module.zip dist/module.json dist/SHA256SUMS.txt --verify-tag --title "Velvet Party HUD $GITHUB_REF_NAME" --notes-file CHANGELOG.md
